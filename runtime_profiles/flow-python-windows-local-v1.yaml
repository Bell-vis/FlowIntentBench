runtime_profile_id: flow-python-windows-local-v1

filesystem:
  # Relative roots are resolved from the per-case staging directory by the
  # native Windows development runtime.
  case_root: case
  workspace_root: workspace
  case_root_read_only: true

network:
  # Native Windows local mode cannot enforce a process-level no-network
  # namespace. This is intentionally advertised rather than hidden.
  available: true

tools:
  python:
    enabled: true
    persistent_within_case: true
    read_root: case
    write_root: workspace
    normal_errors_returned: true
    root_recursive_search_blocked: true

libraries:
  NumPy: available
  SciPy: available
  Matplotlib: available
  VTK: available

filesystem_policy:
  root_recursive_search: best_effort_source_guard

output_policy:
  max_returned_text_chars_per_call: 16000
